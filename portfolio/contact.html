        <header><h1>Contact</h1></header>

        <main>
            <h1>Contact form</h1>
            <p>Feel free to ask questions or get in touch with me via the form below!</p>
            <div>
                <form id="contact-form" action="action.html">
                    <label>First Name:</label>
                    <input type="text" id="fname" placeholder="Please enter your first name">
                    <label>Last Name:</label>
                    <input type="text" id="lname" placeholder="Please enter your last name">
                    <label>Email Adress:</label>
                    <input type="text" id="email" placeholder="Please enter your email adress">
                    <label>Message:</label>
                    <textarea name="message" rows="5" placeholder="Please enter messages here"></textarea>
                    <div id="submit">
                        <input type="submit" value="Submit">
                    </div>
                </form>
            </div>
        </main>
    </div>
